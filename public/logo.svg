<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB8" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9E7D47" />
    </linearGradient>

    <!-- Subtle Bevel Gold Gradient -->
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D1A7" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#7A5E33" />
    </linearGradient>

    <!-- Deep Luxury Black Radial Gradient for Disc Background -->
    <radialGradient id="blackBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E0E12" />
      <stop offset="65%" stop-color="#070709" />
      <stop offset="100%" stop-color="#020203" />
    </radialGradient>

    <!-- Deep Royal Sapphire Blue Iris Gradient -->
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F1B2B" />
      <stop offset="45%" stop-color="#142C4C" />
      <stop offset="85%" stop-color="#1E477D" />
      <stop offset="100%" stop-color="#16345C" />
    </radialGradient>

    <!-- Dark Center Lens Core -->
    <radialGradient id="lensCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06090F" />
      <stop offset="70%" stop-color="#0A111A" />
      <stop offset="100%" stop-color="#12253D" />
    </radialGradient>
  </defs>

  <!-- ================= CIRCULAR EMBLEM BASE ================= -->
  <!-- Outer Deep Black Circle (clipped to round) -->
  <circle cx="200" cy="200" r="197" fill="url(#blackBgGrad)" />

  <!-- Outer Fine Gold Ring (Hairline luxury bezel) -->
  <circle cx="200" cy="200" r="196" fill="none" stroke="url(#goldBorderGrad)" stroke-width="2.5" />

  <!-- Inner Delicate Concentric Gold Ring -->
  <circle cx="200" cy="200" r="188" fill="none" stroke="rgba(203, 176, 126, 0.28)" stroke-width="1" />

  <!-- ================= LOGO ARTWORK (CENTERED) ================= -->
  <g transform="translate(10, 5)">
    <!-- Camera Body Top & Left Contour -->
    <path d="M 125 105 
             L 142 85 
             Q 146 80 154 80 
             L 196 80 
             Q 204 80 208 85 
             L 225 105 
             Q 235 105 240 115 
             L 242 165
             C 242 195 210 205 160 206
             C 105 207 90 198 90 165
             L 90 120
             Q 90 105 105 105
             Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Flowing Baseline Ribbon / Swash Under Camera -->
    <path d="M 85 204 
             C 115 204 140 210 185 202 
             C 225 194 250 150 258 115
             C 265 85 285 85 292 105
             C 300 130 295 180 325 210" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="4.8" 
          stroke-linecap="round" />

    <!-- Calligraphic Script "N" Flourish overlapping on the Right -->
    <path d="M 235 190 
             C 248 150 262 100 274 90 
             C 282 82 292 90 286 110 
             C 275 145 255 192 278 198 
             C 292 201 306 175 315 140 
             C 320 120 325 96 332 94 
             C 338 92 342 98 338 112 
             C 328 152 312 208 335 212" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- ================= CAMERA LENS APERTURE ================= -->
    <!-- Outer Lens Golden Ring -->
    <circle cx="168" cy="150" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" />
    <circle cx="168" cy="150" r="34" fill="url(#irisGrad)" stroke="#1F4472" stroke-width="1.5" />

    <!-- Aperture Blades Details (8 Facets) -->
    <g stroke="rgba(203, 176, 126, 0.45)" stroke-width="1.2" fill="none">
      <path d="M 168 116 L 186 136" />
      <path d="M 192 126 L 195 152" />
      <path d="M 202 150 L 182 168" />
      <path d="M 192 174 L 168 174" />
      <path d="M 168 184 L 150 164" />
      <path d="M 144 174 L 141 148" />
      <path d="M 134 150 L 154 132" />
      <path d="M 144 126 L 168 126" />
    </g>

    <!-- Deep Dark Center Aperture Hole -->
    <circle cx="168" cy="150" r="16" fill="url(#lensCore)" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- Inner Reflection / Glass Sparkle -->
    <path d="M 160 142 A 10 10 0 0 1 176 142" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Small Viewfinder Accent on Top -->
    <rect x="188" y="93" width="10" height="6" rx="2" fill="url(#goldGrad)" />

    <!-- ================= TYPOGRAPHY ================= -->
    <!-- Primary Brand Wordmark: NOULPROD -->
    <text x="180" y="272" 
          text-anchor="middle" 
          fill="url(#goldGrad)" 
          font-family="'Plus Jakarta Sans', 'Cinzel', 'Playfair Display', -apple-system, sans-serif" 
          font-size="33" 
          font-weight="700" 
          letter-spacing="5">NOULPROD</text>

    <!-- Subtitle Wordmark: PRODUCTION -->
    <text x="180" y="306" 
          text-anchor="middle" 
          fill="url(#goldGrad)" 
          font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-size="14" 
          font-weight="600" 
          letter-spacing="9">PRODUCTION</text>
  </g>
</svg>
