<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#11100e" />
  <title>NOUL PRODUCTION — Photographer &amp; Visual Storyteller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Italiana&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rail: 82px;
      --ink: #11110f;
      --paper: #efede7;
      --dark: #171714;
      --muted: #77766f;
      --line: rgba(17,17,15,.14);
      --serif: "Italiana", Georgia, serif;
      --sans: "DM Sans", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    body.menu-open { overflow: hidden; }
    img, video { display: block; width: 100%; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; }

    .rail {
      position: fixed;
      z-index: 80;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--rail);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 22px 0;
      background: #11110f;
      color: #fff;
      border-right: 1px solid rgba(255,255,255,.08);
    }
    .rail-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.18);
      font-family: var(--serif);
      font-size: 15px;
      letter-spacing: .08em;
    }
    .rail-nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
    }
    .rail-nav a {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .19em;
      text-transform: uppercase;
      opacity: .58;
      transition: .2s ease;
    }
    .rail-nav a:hover, .rail-nav a.active { opacity: 1; }
    .rail-social {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 8px;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .7;
    }

    .menu-button {
      position: fixed;
      z-index: 90;
      right: 24px;
      top: 24px;
      width: 58px;
      height: 58px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(17,17,15,.7);
      color: #fff;
      backdrop-filter: blur(10px);
      cursor: pointer;
    }
    .menu-button span {
      position: relative;
      width: 20px;
      height: 1px;
      background: currentColor;
    }
    .menu-button span::before, .menu-button span::after {
      content: "";
      position: absolute;
      left: 0;
      width: 20px;
      height: 1px;
      background: currentColor;
    }
    .menu-button span::before { top: -7px; }
    .menu-button span::after { top: 7px; }
    .mobile-menu {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      background: #11110f;
      color: #fff;
      opacity: 0;
      visibility: hidden;
      transition: .35s ease;
    }
    .mobile-menu.open { opacity: 1; visibility: visible; }
    .mobile-menu-top { display: flex; align-items: center; justify-content: space-between; }
    .mobile-close { width: 44px; height: 44px; border: 1px solid rgba(255,255,255,.18); background: transparent; color: #fff; font-size: 24px; }
    .mobile-links { display: flex; flex-direction: column; }
    .mobile-links a { padding: 8px 0; font-family: var(--serif); font-size: 48px; line-height: 1; }

    #app { margin-left: var(--rail); min-height: 100vh; }

    .hero {
      position: relative;
      height: 100svh;
      min-height: 680px;
      overflow: hidden;
      background: #161614;
      color: #fff;
    }
    .hero-media { position: absolute; inset: 0; }
    .hero-media img { height: 100%; object-fit: cover; object-position: center 34%; animation: heroReveal 1.6s cubic-bezier(.16,1,.3,1) both; }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(8,8,7,.7), rgba(8,8,7,.06) 58%, rgba(8,8,7,.22)), linear-gradient(180deg, rgba(8,8,7,.08) 45%, rgba(8,8,7,.72));
    }
    .hero-inner {
      position: absolute;
      z-index: 2;
      left: clamp(28px, 5vw, 72px);
      right: clamp(28px, 5vw, 72px);
      bottom: clamp(44px, 8vh, 82px);
    }
    .hero-kicker {
      margin: 0 0 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    .hero h1 {
      margin: 0;
      max-width: 850px;
      font-family: var(--serif);
      font-size: clamp(82px, 9.2vw, 150px);
      font-weight: 400;
      line-height: .78;
      letter-spacing: -.04em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(28px);
      animation: revealUp .9s .2s cubic-bezier(.16,1,.3,1) forwards;
    }
    .hero-actions { display: flex; gap: 12px; margin-top: 30px; }
    .button {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      border: 1px solid currentColor;
      padding: 0 20px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .button.light { background: #fff; color: var(--ink); border-color: #fff; }
    .hero-scroll {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .section { padding: 110px clamp(28px, 5vw, 72px); }
    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 34px;
    }
    .eyebrow { margin: 0 0 8px; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .19em; text-transform: uppercase; }
    .section-title { margin: 0; font-family: var(--serif); font-size: clamp(46px, 6vw, 74px); line-height: .95; font-weight: 400; }
    .view-link { border-bottom: 1px solid currentColor; padding-bottom: 5px; font-size: 10px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; }
    .mobile-view-link { display: none; }

    .media-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .media-card {
      position: relative;
      height: clamp(300px, 34vw, 520px);
      overflow: hidden;
      background: #1c1c1a;
      color: #fff;
      cursor: pointer;
    }
    .media-card img, .media-card video { height: 100%; object-fit: cover; transition: transform .7s cubic-bezier(.16,1,.3,1); }
    .media-card:hover img, .media-card:hover video { transform: scale(1.025); }
    .media-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.72)); }
    .media-meta { position: absolute; z-index: 2; left: 20px; right: 20px; bottom: 18px; }
    .media-meta span { font-size: 9px; letter-spacing: .15em; text-transform: uppercase; opacity: .75; }
    .media-meta h3 { margin: 5px 0 0; font-family: var(--serif); font-size: 27px; font-weight: 400; }

    .services { background: #151513; color: #fff; }
    .services .eyebrow { color: rgba(255,255,255,.55); }
    .service-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .service-heading { margin: 0 0 14px; font-family: var(--serif); font-size: 34px; font-weight: 400; }
    .service-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .service-item {
      min-height: 154px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
      border: 1px solid rgba(255,255,255,.12);
    }
    .service-item span { color: rgba(255,255,255,.5); font-size: 9px; letter-spacing: .14em; }
    .service-item h4 { margin: 0 0 6px; font-family: var(--serif); font-size: 20px; font-weight: 400; }
    .service-item p { margin: 0; color: rgba(255,255,255,.58); font-size: 11px; line-height: 1.55; }

    .cta { min-height: 520px; display: grid; align-items: end; background: #d8d4ca; }
    .cta-inner { width: 100%; }
    .cta h2 { max-width: 900px; margin: 10px 0 38px; font-family: var(--serif); font-size: clamp(62px, 8vw, 112px); line-height: .86; font-weight: 400; letter-spacing: -.04em; }
    .cta-bottom { display: flex; justify-content: space-between; align-items: end; border-top: 1px solid var(--line); padding-top: 22px; }
    .cta p { max-width: 500px; color: #606057; line-height: 1.7; }
    .cta .button { background: var(--ink); color: #fff; }

    footer { background: #11110f; color: rgba(255,255,255,.68); }
    .footer-inner { min-height: 140px; display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; gap: 30px; }
    .footer-brand { color: #fff; font-family: var(--serif); font-size: 20px; }
    .footer-links { display: flex; justify-content: center; gap: 20px; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
    .footer-copy { justify-self: end; font-size: 9px; }

    .page-hero {
      position: relative;
      height: 300px;
      min-height: 300px;
      display: flex;
      align-items: end;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      border-bottom: 1px solid var(--line);
    }
    .page-hero img { display: none; }
    .page-hero::after { display: none; }
    .page-hero-inner { position: relative; z-index: 2; width: 100%; padding: 0 clamp(28px,5vw,72px) clamp(38px,7vh,70px); }
    .page-hero h1 { margin: 8px 0 0; font-family: var(--serif); font-size: clamp(72px,9vw,130px); font-weight: 400; line-height: .82; }
    .page-hero p { margin: 12px 0 0; max-width: 620px; color: var(--muted); }

    .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter { flex: 0 0 auto; min-height: 38px; padding: 0 14px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 9px; font-weight: 600; letter-spacing: .12em; }
    .filter.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .gallery-item { position: relative; aspect-ratio: 4/5; overflow: hidden; background: #ddd; cursor: pointer; }
    .gallery-item.hidden { display: none; }
    .gallery-item img, .gallery-item video { height: 100%; object-fit: cover; object-position: var(--position, 50% 50%); transition: transform .6s ease; }
    .gallery-item:hover img, .gallery-item:hover video { transform: scale(1.02); }
    .gallery-caption { position: absolute; left: 16px; right: 16px; bottom: 14px; color: #fff; opacity: 0; transition: .25s ease; text-shadow: 0 2px 12px #000; }
    .gallery-item:hover .gallery-caption { opacity: 1; }
    .gallery-caption strong { display: block; font-family: var(--serif); font-size: 20px; font-weight: 400; }
    .gallery-caption span { font-size: 8px; letter-spacing: .14em; text-transform: uppercase; }

    .about-copy { display: grid; grid-template-columns: .85fr 1.15fr; gap: clamp(40px,8vw,110px); align-items: start; }
    .about-copy img { height: 680px; object-fit: cover; object-position: 50% 42%; }
    .about-copy h2 { margin: 0 0 22px; }
    .about-copy p { color: #55554f; line-height: 1.85; }
    .quote { padding: 90px clamp(28px,5vw,72px); background: #d8d4ca; font-family: var(--serif); font-size: clamp(38px,5vw,72px); line-height: 1.08; }

    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(30px,7vw,90px); }
    .contact-grid h1 { margin: 8px 0 20px; font-family: var(--serif); font-size: clamp(56px,7vw,96px); line-height: .92; font-weight: 400; }
    .contact-form { display: grid; gap: 12px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 9px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    .field input, .field textarea, .field select { width: 100%; min-height: 48px; border: 1px solid var(--line); background: #f7f5ef; padding: 12px; outline: none; }
    .field textarea { min-height: 120px; resize: vertical; }
    .contact-channels { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-top: 40px; }
    .channel { border-top: 1px solid var(--line); padding-top: 14px; }
    .channel span { display: block; margin-bottom: 6px; color: var(--muted); font-size: 8px; letter-spacing: .14em; text-transform: uppercase; }
    .whatsapp-panel {
      min-height: 420px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--line);
      background: #d8d4ca;
      padding: clamp(28px, 4vw, 48px);
    }
    .whatsapp-panel h2 {
      max-width: 520px;
      margin: 12px 0 24px;
      font-family: var(--serif);
      font-size: clamp(42px, 5vw, 68px);
      line-height: .92;
      font-weight: 400;
    }
    .whatsapp-panel p { max-width: 460px; color: #626159; line-height: 1.7; }
    .whatsapp-links { display: grid; gap: 10px; }
    .whatsapp-links .button { width: 100%; background: #11110f; color: #fff; border-color: #11110f; }

    .lightbox { position: fixed; z-index: 120; inset: 0; display: none; place-items: center; background: rgba(10,10,9,.96); color: #fff; }
    .lightbox.open { display: grid; }
    .lightbox-inner { width: min(1100px, calc(100% - 48px)); }
    .lightbox-media { max-height: 78vh; }
    .lightbox-media img, .lightbox-media video { max-height: 78vh; object-fit: contain; }
    .lightbox-close { position: absolute; top: 18px; right: 18px; width: 44px; height: 44px; border: 1px solid rgba(255,255,255,.2); background: transparent; color: #fff; font-size: 22px; }

    [data-reveal] { opacity: 0; transform: translateY(24px); transition: .8s cubic-bezier(.16,1,.3,1); }
    [data-reveal].revealed { opacity: 1; transform: translateY(0); }
    @keyframes revealUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes heroReveal { from { transform: scale(1.06); filter: brightness(.72); } to { transform: scale(1); filter: brightness(1); } }

    @media (min-width: 901px) {
      .hero-media {
        left: auto;
        right: 0;
        width: 58%;
        background: #dce3e3;
        border-left: 1px solid rgba(255,255,255,.1);
      }
      .hero-media img {
        width: 82%;
        height: 92%;
        margin: 8% auto 0;
        object-fit: contain;
        object-position: center bottom;
        background: #dce3e3;
        transform: translateY(2%);
        transform-origin: center bottom;
        animation: none;
      }
      .hero::after {
        background: linear-gradient(90deg, rgba(8,8,7,.78), rgba(8,8,7,.22) 52%, rgba(8,8,7,.08)), linear-gradient(180deg, rgba(8,8,7,.05) 45%, rgba(8,8,7,.55));
      }
    }

    @media (max-width: 900px) {
      :root { --rail: 0px; }
      .rail { display: none; }
      .menu-button { display: flex; }
      #app { margin-left: 0; }
      .hero { height: 92svh; min-height: 620px; }
      .hero-media img { object-position: 58% center; }
      .hero-inner { left: 20px; right: 20px; bottom: 38px; }
      .hero h1 { font-size: clamp(64px,16vw,100px); }
      .hero-scroll { display: none; }
      .section { padding: 72px 20px; }
      .media-grid { grid-template-columns: 1fr; }
      .media-card { height: 520px; }
      .service-grid, .about-copy, .contact-grid { grid-template-columns: 1fr; }
      .gallery { grid-template-columns: repeat(2,1fr); }
      .footer-inner { grid-template-columns: 1fr; text-align: center; padding: 32px 20px; }
      .footer-links, .footer-copy { justify-self: center; }
      .cta-bottom { align-items: start; flex-direction: column; gap: 22px; }
    }
    @media (max-width: 600px) {
      .hero h1 { font-size: clamp(58px,17vw,76px); }
      .hero-actions { display: grid; grid-template-columns: 1fr 1fr; }
      .button { width: 100%; padding-inline: 10px; }
      .section-head { align-items: start; }
      .section-title { font-size: 48px; }
      .view-link { display: none; }
      .mobile-view-link {
        display: inline-flex;
        align-items: center;
        min-height: 42px;
        margin-top: 18px;
        border-bottom: 1px solid currentColor;
        padding-bottom: 4px;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: .13em;
        text-transform: uppercase;
      }
      .media-card { height: 420px; }
      .service-list { grid-template-columns: 1fr; }
      .gallery { gap: 8px; }
      .gallery-item { aspect-ratio: 4/5; }
      .gallery-caption { opacity: 1; left: 10px; right: 10px; bottom: 10px; }
      .gallery-caption strong { font-size: 17px; }
      .page-hero { height: 230px; min-height: 230px; }
      .page-hero-inner { padding-inline: 20px; }
      .page-hero h1 { font-size: 68px; }
      .about-copy img { height: 460px; }
      .quote { padding: 64px 20px; }
      .form-row, .contact-channels { grid-template-columns: 1fr; }
      .cta { min-height: 520px; }
      .cta h2 { font-size: 58px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <aside class="rail" aria-label="Primary">
    <a class="rail-mark" href="#/" aria-label="NOUL home">NP</a>
    <nav class="rail-nav">
      <a href="#/">Home</a>
      <a href="#/stills">Portfolio</a>
      <a href="#/services">Services</a>
      <a href="#/about">About</a>
      <a href="#/contact">Contact</a>
    </nav>
    <a class="rail-social" href="https://www.instagram.com/noulprod" target="_blank" rel="noopener">Instagram</a>
  </aside>
  <button class="menu-button" id="menuButton" aria-label="Open menu"><span></span></button>
  <aside class="mobile-menu" id="mobileMenu">
    <div class="mobile-menu-top"><a class="rail-mark" href="#/">NP</a><button class="mobile-close" id="menuClose" aria-label="Close menu">×</button></div>
    <nav class="mobile-links">
      <a href="#/">Home</a><a href="#/stills">Portfolio</a><a href="#/services">Services</a><a href="#/about">About</a><a href="#/contact">Contact</a>
    </nav>
    <a href="https://www.instagram.com/noulprod" target="_blank" rel="noopener">@noulprod</a>
  </aside>
  <main id="app"></main>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button class="lightbox-close" id="lightboxClose">×</button>
    <div class="lightbox-inner"><div class="lightbox-media" id="lightboxMedia"></div></div>
  </div>
  <script>
    const app = document.getElementByState = document.getElementById("app");
    const menuButton = document.getElementById("menuButton");
    const mobileMenu = document.getElementById("mobileMenu");
    const menuClose = document.getElementById("menuClose");
    const lightbox = document.getElementById("lightbox");
    const lightboxMedia = document.getElementById("lightboxMedia");

    function setMenu(open) {
      mobileMenu.classList.toggle("open", open);
      document.body.classList.toggle("menu-open", open);
    }
    menuButton.onclick = () => setMenu(true);
    menuClose.onclick = () => setMenu(false);
    mobileMenu.querySelectorAll("a").forEach(a => a.onclick = () => setMenu(false));
    document.getElementById("lightboxClose").onclick = closeLightbox;
    lightbox.onclick = event => { if (event.target === lightbox) closeLightbox(); };
    function closeLightbox() { lightbox.classList.remove("open"); lightboxMedia.innerHTML = ""; }
    document.onkeydown = event => { if (event.key === "Escape") closeLightbox(); };

    const footer = () => `
      <footer><div class="footer-inner section" style="min-height:140px;padding-top:32px;padding-bottom:32px">
        <a class="footer-brand" href="#/">NOUL PRODUCTION</a>
        <nav class="footer-links"><a href="#/stills">Portfolio</a><a href="#/about">About</a><a href="#/services">Services</a><a href="#/contact">Contact</a></nav>
        <span class="footer-copy">© 2026 NOUL PRODUCTION</span>
      </div></footer>`;

    const home = () => `
      <section class="hero" id="home">
        <div class="hero-media"><img src="/assets/images/photographer/portrait.jpg" alt="NOUL PRODUCTION portrait" /></div>
        <div class="hero-inner">
          <p class="hero-kicker">Photographer &amp; Visual Storyteller</p>
          <h1>NOUL<br/>PRODUCTION</h1>
          <div class="hero-actions"><a class="button light" href="#/stills">View Portfolio <span>→</span></a><a class="button" href="#/contact">Get In Touch</a></div>
        </div>
      </section>
      <section class="section" id="projects">
        <div class="section-head" data-reveal><div><p class="eyebrow">Selected Visuals</p><h2 class="section-title">Latest Projects</h2></div><a class="view-link" href="#/stills">View All Work</a></div>
        <div class="media-grid" data-reveal>
          ${mediaCard("/assets/images/weddings/wedding-03.mp4","Wedding","A Promise at Dusk","video")}
          ${mediaCard("/assets/images/weddings/wedding-06.mp4","Wedding","Wedding Moment","video")}
          ${mediaCard("/assets/images/content/content-02.mp4","Content","Ride Together","video")}
        </div>
        <a class="mobile-view-link" href="#/stills">View All Work</a>
      </section>
      <section class="section" id="reels">
        <div class="section-head" data-reveal><div><p class="eyebrow">Short Form</p><h2 class="section-title">Visual Stories</h2></div><a class="view-link" href="#/stills">View All Visuals</a></div>
        <div class="media-grid" data-reveal>
          ${mediaCard("/assets/images/content/content-01.mp4","Reel","Motion 01","video")}
          ${mediaCard("/assets/images/content/content-03.mp4","Reel","Motion 03","video")}
          ${mediaCard("/assets/images/content/content-04.mp4","Reel","Motion 04","video")}
        </div>

    function setupMedia() {
      document.querySelectorAll("[data-lightbox]").forEach(card => card.onclick = () => {
        const isVideo = card.dataset.type === "video";
        lightboxMedia.innerHTML = isVideo
          ? `<video src="${card.dataset.lightbox}" controls playsinline muted autoplay loop></video>`
          : `<img src="${card.dataset.lightbox}" alt="${card.dataset.title || ""}" />`;
        lightbox.classList.add("open");
        if (isVideo) {
          const video = lightboxMedia.querySelector("video");
          video.muted = true;
          video.play().catch(() => {});
          video.onclick = () => {
            video.muted = false;
            video.play().catch(() => {});
          };
        }
      });
      document.querySelectorAll(".media-card video, .gallery-item video").forEach(video => {
        video.muted = true;
        video.autoplay = true;
        video.loop = true;
        video.playsInline = true;
        video.play().catch(() => {});
        video.parentElement.onmouseenter = () => video.play().catch(() => {});
        video.parentElement.onmouseleave = () => {
          if (matchMedia("(hover: none)").matches) video.play().catch(() => {});
        };
      });
      document.querySelectorAll("[data-reveal]").forEach(el => {
        if ("IntersectionObserver" in window) {
          const observer = new IntersectionObserver(entries => entries.forEach(entry => {
            if (entry.isIntersecting) { entry.target.classList.add("revealed"); observer.unobserve(entry.target); }
          }), { threshold: .12 });
          observer.observe(el);
        } else el.classList.add("revealed");
      });
      document.querySelectorAll(".filter").forEach(button => button.onclick = () => {
        document.querySelectorAll(".filter").forEach(b => b.classList.toggle("active", b === button));
        const filter = button.dataset.filter;
        document.querySelectorAll(".gallery-item").forEach(item => item.classList.toggle("hidden", filter !== "ALL" && item.dataset.category !== filter));
      });
    }

    function route() {
      const path = location.hash.replace("#","");
      document.querySelectorAll(".rail-nav a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === `#${path === "" ? "/" : path}`));
      if (path === "/" || path === "") app.innerHTML = home();
      else if (path === "/stills") app.innerHTML = galleryPage();
      else if (path === "/about") app.innerHTML = aboutPage();
      else if (path === "/services") app.innerHTML = servicesPage();
      else if (path === "/contact") app.innerHTML = contactPage();
      else app.innerHTML = home();
      window.scrollTo({ top: 0, behavior: "instant" });
      setupMedia();
    }
    window.addEventListener("hashchange", route);
    route();
